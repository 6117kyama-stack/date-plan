<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>♡ Date Plan ♡</title>

    <!-- EmailJS -->
    <script
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                "Hiragino Maru Gothic ProN",
                "Yu Gothic",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ffdce7,
                    #fff5f8
                );

            overflow: hidden;
        }

        /* 背景ハート */

        .heart {
            position: fixed;

            color: rgba(255, 100, 150, 0.25);

            font-size: 35px;

            animation:
                float 5s infinite ease-in-out;

            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 8%;
            top: 15%;
        }

        .heart:nth-child(2) {
            left: 85%;
            top: 20%;
            animation-delay: 1s;
        }

        .heart:nth-child(3) {
            left: 15%;
            top: 75%;
            animation-delay: 2s;
        }

        .heart:nth-child(4) {
            left: 80%;
            top: 75%;
            animation-delay: 3s;
        }

        @keyframes float {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }


        /* カード */

        .card {
            width: min(100%, 430px);

            padding: 40px 28px;

            background:
                rgba(255,255,255,0.95);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(220,90,130,0.2);

            position: relative;

            z-index: 10;
        }


        /* 画面切り替え */

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }


        /* ハート */

        .top-heart {
            font-size: 55px;

            margin-bottom: 10px;

            animation:
                heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        /* タイトル */

        h1 {
            margin: 0;

            color: #e9577d;

            font-size: 30px;
        }

        .subtitle {
            margin-top: 10px;

            color: #888;

            font-size: 15px;
        }


        /* 合言葉 */

        .secret-title {
            margin-top: 30px;

            color: #555;

            font-size: 18px;

            font-weight: bold;
        }

        input {
            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border:
                2px solid #ffd0dc;

            border-radius: 15px;

            background: #fff8fa;

            color: #555;

            font-size: 16px;

            outline: none;

            text-align: center;
        }

        input:focus {
            border-color: #f27e9b;
        }


        /* ボタン */

        button {
            width: 100%;

            margin-top: 20px;

            padding: 16px;

            border: none;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #ff91ae,
                    #f36d94
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(243,109,148,0.3);

            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;

            cursor: default;
        }


        /* メッセージ */

        .message {
            margin-top: 15px;

            min-height: 24px;

            color: #e9577d;

            font-size: 14px;

            font-weight: bold;
        }


        /* 質問 */

        .question {
            margin-top: 30px;

            color: #555;

            font-size: 18px;

            font-weight: bold;
        }


        /* 日付 */

        input[type="date"] {
            text-align: center;
        }


        /* 結果 */

        #result {
            display: none;

            margin-top: 25px;

            padding: 22px;

            border-radius: 20px;

            background: #fff0f5;

            color: #e9577d;

            font-size: 17px;

            font-weight: bold;

            line-height: 1.7;
        }


        .small {
            margin-top: 18px;

            color: #aaa;

            font-size: 12px;
        }


        /* 成功 */

        .success {
            color: #e9577d;
        }


        /* エラー */

        .error {
            color: #d9534f;
        }

    </style>

</head>


<body>


    <!-- 背景 -->

    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>


    <div class="card">


        <!-- ======================
             合言葉画面
        ======================= -->

        <section
            id="passwordScreen"
            class="screen active">


            <div class="top-heart">
                💕
            </div>


            <h1>
                Date Plan
            </h1>


            <div class="subtitle">
                ふたりだけのページだよ♡
            </div>


            <div class="secret-title">
                🔐 合言葉を入れてね
            </div>


            <input
                type="password"
                id="password"
                placeholder="ひみつの合言葉"
                autocomplete="off"
            >


            <button
                id="passwordButton"
                type="button">

                💗 開く

            </button>


            <div
                id="passwordMessage"
                class="message">
            </div>


        </section>


        <!-- ======================
             デート日画面
        ======================= -->

        <section
            id="dateScreen"
            class="screen">


            <div class="top-heart">
                💕
            </div>


            <h1>
                Date Plan
            </h1>


            <div class="subtitle">
                次のデート、いつにする？♡
            </div>


            <div class="question">
                📅 デートしたい日を選んでね
            </div>


            <input
                type="date"
                id="date"
            >


            <button
                id="dateButton"
                type="button">

                💗 この日にする！

            </button>


            <div
                id="result">
            </div>


            <div class="small">
                ふたりの楽しい予定を決めよう ♡
            </div>


        </section>


    </div>


    <script>


        /* =====================================
           設定
        ===================================== */


        /*
         * 🔐 合言葉
         *
         * 好きな言葉に変更してください。
         */

        const SECRET_PASSWORD =
            "こうへい＆まなみ";


        /*
         * EmailJS Public Key
         */

        const EMAILJS_PUBLIC_KEY =
            "BfSSEH-k4YQ6xbela";


        /*
         * EmailJS Service ID
         */

        const EMAILJS_SERVICE_ID =
            "service_to87c89";


        /*
         * EmailJS Template ID
         */

        const EMAILJS_TEMPLATE_ID =
            "template_wpl2x8h";


        /* =====================================
           EmailJS初期化
        ===================================== */

        emailjs.init({

            publicKey:
                EMAILJS_PUBLIC_KEY

        });


        /* =====================================
           HTML取得
        ===================================== */

        const password =
            document.getElementById(
                "password"
            );


        const passwordButton =
            document.getElementById(
                "passwordButton"
            );


        const passwordMessage =
            document.getElementById(
                "passwordMessage"
            );


        const passwordScreen =
            document.getElementById(
                "passwordScreen"
            );


        const dateScreen =
            document.getElementById(
                "dateScreen"
            );


        const dateInput =
            document.getElementById(
                "date"
            );


        const dateButton =
            document.getElementById(
                "dateButton"
            );


        const result =
            document.getElementById(
                "result"
            );


        /* =====================================
           合言葉チェック
        ===================================== */

        passwordButton.addEventListener(
            "click",
            checkPassword
        );


        /*
         * Enterでも開ける
         */

        password.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    checkPassword();

                }

            }
        );


        function checkPassword() {


            if (
                password.value ===
                SECRET_PASSWORD
            ) {


                /*
                 * 合言葉正解
                 */

                passwordMessage.innerText =
                    "💕 正解！";


                passwordScreen
                    .classList
                    .remove("active");


                dateScreen
                    .classList
                    .add("active");


            } else {


                /*
                 * 合言葉不正解
                 */

                passwordMessage.innerText =
                    "🥺 合言葉が違うよ";


                password.value = "";


                password.focus();

            }

        }


        /* =====================================
           デート日決定
        ===================================== */

        dateButton.addEventListener(
            "click",
            decideDate
        );


        function decideDate() {


            /*
             * 日付チェック
             */

            if (
                dateInput.value === ""
            ) {

                showResult(
                    "🥺 デートの日を選んでね♡",
                    "error"
                );

                return;

            }


            /*
             * 日付取得
             */

            const date =
                new Date(
                    dateInput.value +
                    "T00:00:00"
                );


            const year =
                date.getFullYear();


            const month =
                date.getMonth() + 1;


            const day =
                date.getDate();


            const week = [

                "日",
                "月",
                "火",
                "水",
                "木",
                "金",
                "土"

            ];


            const weekday =
                week[
                    date.getDay()
                ];


            /*
             * メールに入れる日付
             */

            const dateText =
                `${year}年${month}月${day}日（${weekday}）`;


            /*
             * 画面表示
             */

            showResult(

                `💗 ${dateText} 💗
                <br>
                この日にデートしよう！♡
                <br><br>
                💌 メールを送信しています...`

            );


            /*
             * ボタン停止
             */

            dateButton.disabled =
                true;


            dateButton.innerText =
                "💌 送信中...";


            /* =================================
               EmailJS送信
            ================================= */

            emailjs.send(

                EMAILJS_SERVICE_ID,

                EMAILJS_TEMPLATE_ID,

                {

                    date:
                        dateText

                }

            )


            /* =================================
               成功
            ================================= */

            .then(

                function(response) {


                    console.log(
                        "送信成功",
                        response
                    );


                    showResult(

                        `💗 ${dateText} 💗
                        <br>
                        この日にデートしよう！♡
                        <br><br>
                        💌 Gmailに送ったよ！`,
                        
                        "success"

                    );


                    dateButton.innerText =
                        "💕 送信完了！";

                }

            )


            /* =================================
               失敗
            ================================= */

            .catch(

                function(error) {


                    console.error(
                        "送信失敗",
                        error
                    );


                    showResult(

                        `💗 ${dateText} 💗
                        <br>
                        この日にデートしよう！♡
                        <br><br>
                        ⚠️ メール送信に失敗しました`,
                        
                        "error"

                    );


                    dateButton.disabled =
                        false;


                    dateButton.innerText =
                        "💗 もう一度送る";

                }

            );

        }


        /* =====================================
           結果表示
        ===================================== */

        function showResult(
            message,
            className = ""
        ) {


            result.style.display =
                "block";


            result.className =
                className;


            result.innerHTML =
                message;

        }


    </script>

</body>

</html>
